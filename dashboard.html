<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng giáo viên · IELTS Mock Test</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4e6cf">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:760px}
.tbl th,.tbl td{border-bottom:1px solid var(--sand);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mocha);position:sticky;top:0;background:var(--paper)}
.tbl tr.pick{background:#eef3fd}
.tbl tbody tr{cursor:pointer}
.scroll{overflow-x:auto}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--cream)}
.chip.ok{background:#e3f3d4;color:var(--green-ink)}.chip.wait{background:#fff1c2}.chip.run{background:#e6ecf8;color:#1d3a73}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:14px}
.ans span{border-radius:8px;padding:4px 8px;background:#fbe1dc}
.ans span.y{background:#e3f3d4}
.essay-view{white-space:pre-wrap;background:#fff;border:1px solid var(--sand);border-radius:12px;padding:12px;line-height:1.6;max-height:420px;overflow:auto}
.grid2{display:grid;gap:14px}
.qprompt{background:#fff;border:1px solid var(--sand);border-radius:12px;padding:10px 14px;margin:6px 0 8px;line-height:1.5}
.qprompt p{margin:0 0 4px}
.qprompt ol,.qprompt ul{margin:4px 0 0;padding-left:22px;list-style:revert}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
iframe.au{width:100%;height:80px;border:1px solid var(--sand);border-radius:10px;background:#fff}
</style>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="config.js"></script>
</head>
<body>
<main class="wrap" style="max-width:1280px;padding-top:16px">
  <div class="row" style="justify-content:space-between"><img class="wm" src="assets/logo-black.png" alt="The Standard." width="760" height="96" style="height:28px"><span class="stamp">Bảng giáo viên</span></div>

  <section class="card" id="login">
    <h2>Đăng nhập giáo viên</h2>
    <div class="row" style="margin-top:12px"><input class="input" id="key" type="password" style="max-width:280px" placeholder="Mã giáo viên" aria-label="Mã giáo viên"><button class="btn" id="enter">Vào</button></div>
    <p class="msg err" id="lerr" hidden style="margin-top:12px"></p>
  </section>

  <div id="app" hidden style="display:grid;gap:16px">
    <div class="row" style="justify-content:space-between">
      <div class="ptabs" role="tablist"><button class="ptab" data-v="list" aria-selected="true">Học viên</button><button class="ptab" data-v="codes" aria-selected="false">Mã vào thi</button></div>
      <div class="row"><span class="small" id="upd"></span><button class="btn ghost" id="reload">Tải lại</button></div>
    </div>

    <section id="vlist" style="display:grid;gap:16px">
      <div class="card scroll"><table class="tbl" id="tbl"><thead><tr><th>Họ tên</th><th>Lớp</th><th>Mã</th><th>Nghe</th><th>Đọc</th><th>Viết</th><th>Nói</th><th>Overall</th><th>Rời trang</th></tr></thead><tbody></tbody></table></div>
      <div id="detail"></div>
    </section>

    <section id="vcodes" hidden style="display:grid;gap:16px">
      <div class="card" style="display:grid;gap:10px">
        <h2>Tạo mã vào thi</h2>
        <p class="small">Mỗi dòng một học viên, theo dạng: Họ và tên, Lớp. Mỗi học viên nhận một mã và một bộ đề chọn ngẫu nhiên.</p>
        <textarea class="essay" id="names" style="min-height:140px" placeholder="Nguyễn Văn An, IELTS T10&#10;Trần Thị Bình, IELTS T10"></textarea>
        <div class="row"><button class="btn blue" id="create">Tạo mã</button><button class="btn ghost" id="csv">Xuất CSV danh sách mã</button><button class="btn ghost" id="copy">Sao chép danh sách để gửi Zalo</button></div>
        <p class="msg" id="cmsg" hidden></p>
      </div>
      <div class="card scroll"><table class="tbl" id="ctbl"><thead><tr><th>Họ tên</th><th>Lớp</th><th>Mã</th><th>Đề được giao</th><th>Trạng thái</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>
  </div>
</main>
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var T = TS, $ = T.$, KEY = '', rows = [], pick = null, flash = '';
  try { KEY = sessionStorage.getItem('ts-ielts-key') || ''; } catch (e) {}
  var tapi = function (a, p) { return T.api(a, Object.assign({ key: KEY }, p || {})); };
  var STV = { open: '', started: '<span class="chip run">đang làm</span>', done: '' };
  var bands = ''; for (var b = 0; b <= 9; b += 0.5) bands += '<option value="' + b + '">' + b.toFixed(1) + '</option>';
  var bands9 = ''; for (var c = 0; c <= 9; c += 1) bands9 += '<option value="' + c + '">' + c + '</option>';
  var half = function (x) { return Math.floor(x * 2 + 0.5) / 2; };

  var ss = function (k, v) { try { if (v === undefined) return JSON.parse(sessionStorage.getItem(k) || 'null'); sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
  var details = {};   // tGet replies kept for this visit
  function showApp() { $('#login').hidden = true; $('#app').hidden = false; }
  function enter() {
    KEY = $('#key').value.trim() || KEY;
    $('#enter').disabled = true; $('#enter').textContent = 'Đang kiểm tra...';
    load(function (ok, r) {          // one request checks the key and brings the list
      $('#enter').disabled = false; $('#enter').textContent = 'Vào';
      if (!ok) { $('#app').hidden = true; $('#login').hidden = false; $('#lerr').textContent = T.err(r); $('#lerr').hidden = false; return; }
      try { sessionStorage.setItem('ts-ielts-key', KEY); } catch (e) {}
      showApp();
    });
  }
  $('#enter').onclick = enter; $('#key').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });
  if (KEY) { var cachedRows = ss('ts-ielts-tlist'); if (cachedRows) { rows = cachedRows; showApp(); draw('Danh sách đã lưu, đang cập nhật...'); } enter(); }

  T.$('.ptabs').onclick = function (e) {
    var v = e.target.getAttribute('data-v'); if (!v) return;
    T.$$('.ptabs .ptab').forEach(function (x) { x.setAttribute('aria-selected', x.getAttribute('data-v') === v); });
    $('#vlist').hidden = v !== 'list'; $('#vcodes').hidden = v !== 'codes';
  };
  $('#reload').onclick = function () { load(); if (pick) open(pick); };

  function cell(r, sk) {
    var st = (r.st[sk] || {}).s || 'open', x = r[sk];
    if (st === 'started') return STV.started;
    if (st !== 'done') return '<span class="small">chưa làm</span>';
    if (sk === 'L' || sk === 'R') return '<b>' + T.bandText(x.band) + '</b> <span class="small">(' + x.raw + '/40)</span>';
    if (x && typeof x.band === 'number') return '<b>' + T.bandText(x.band) + '</b>';
    return '<span class="chip wait">chờ chấm</span>';
  }
  function load(cb) {
    $('#upd').textContent = rows.length ? 'Đang cập nhật...' : 'Đang tải...';
    tapi('tList').then(function (r) {
      if (!r.ok) { $('#upd').textContent = T.err(r); cb && cb(false, r); return; }
      rows = r.rows; ss('ts-ielts-tlist', rows); draw(); cb && cb(true, r);
    });
  }
  function draw(note) {
      $('#upd').textContent = note || ((flash ? flash + ' · ' : '') + 'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN')); flash = '';
      var h = '';
      rows.forEach(function (x) {
        var blur = ['L', 'R', 'W'].reduce(function (a, k) { return a + ((x[k] && x[k].blur) || 0); }, 0);
        h += '<tr data-code="' + x.code + '"' + (x.code === pick ? ' class="pick"' : '') + '><td><b>' + T.esc(x.name) + '</b></td><td>' + T.esc(x.cls) + '</td><td class="num">' + x.code + '</td><td>' + cell(x, 'L') + '</td><td>' + cell(x, 'R') + '</td><td>' + cell(x, 'W') + '</td><td>' + cell(x, 'S') + '</td><td><b>' + (typeof x.overall === 'number' ? x.overall.toFixed(1) : '') + '</b></td><td>' + (blur ? blur + ' lần' : '') + '</td></tr>';
      });
      $('#tbl tbody').innerHTML = h || '<tr><td colspan="9" class="small">Chưa có học viên. Tạo mã ở tab Mã vào thi.</td></tr>';
      var c = '';
      rows.forEach(function (x) {
        var asg = x.asg ? [].concat(x.asg.L, x.asg.R, x.asg.W, x.asg.S).join(' ') : '';
        var st = T.ORDER.map(function (k) { var v = (x.st[k] || {}).s || 'open'; return T.SKVI[k] + ': ' + (v === 'open' ? 'chưa mở' : v === 'started' ? 'đang làm' : 'đã nộp'); }).join(' · ');
        c += '<tr><td>' + T.esc(x.name) + '</td><td>' + T.esc(x.cls) + '</td><td class="num"><b>' + x.code + '</b></td><td class="small">' + asg + '</td><td class="small">' + st + '</td><td><button class="btn ghost" style="min-height:36px;padding:0 12px" data-del="' + x.code + '">Xóa</button></td></tr>';
      });
      $('#ctbl tbody').innerHTML = c;
  }
  function rowOf(code) { return rows.filter(function (x) { return x.code === code; })[0]; }
  function saved(code, skill, band, x) {   // update the table without reloading the whole list
    var r = rowOf(code);
    if (r) { r[skill] = Object.assign({}, r[skill] || {}, { band: band }); r.overall = x.overall; ss('ts-ielts-tlist', rows); }
    flash = 'Đã lưu điểm ' + (skill === 'W' ? 'Viết' : 'Nói'); draw();
  }
  $('#tbl').onclick = function (e) { var tr = e.target.closest('tr[data-code]'); if (tr) { pick = tr.getAttribute('data-code'); T.$$('#tbl tr').forEach(function (x) { x.classList.toggle('pick', x === tr); }); open(pick); } };

  function ansGrid(sk, ids, rec) {
    if (!rec) return '<p class="small">Chưa nộp.</p>';
    var h = '<p><b>Band ' + T.bandText(rec.band) + '</b> · ' + rec.raw + ' trên 40 câu đúng · rời trang ' + ((rec.meta || {}).blur || 0) + ' lần</p><div class="ans" style="margin-top:8px">';
    for (var q = 1; q <= 40; q++) h += '<span class="' + (rec.detail && rec.detail[q] ? 'y' : '') + '"><b>' + q + '.</b> ' + T.esc((rec.answers || {})[q] || '(trống)') + '</span>';
    return h + '</div>';
  }
  function open(code) {
    if (details[code]) show(details[code]); else $('#detail').innerHTML = '<p class="small">Đang tải bài làm...</p>';
    tapi('tGet', { code: code }).then(function (r) {
      if (pick !== code) return;
      if (!r.ok) { $('#detail').innerHTML = '<p class="msg err">' + T.err(r) + '</p>'; return; }
      var same = details[code] && JSON.stringify(details[code]) === JSON.stringify(r);
      details[code] = r;
      var typing = document.activeElement && /TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#detail').contains(document.activeElement);
      if (!same && !typing) show(r);
    });
  }
  /* The questions the student was asked, so the marker can read them next to each recording. */
  function speakingPrompt(sq, part, idx) {
    if (!sq) return '';
    var li = function (x) { return '<li>' + T.esc(x) + '</li>'; }, h = '', asked = function (list) { return idx.map(function (i) { return list[i]; }); };
    if (part === 1) h = '<p><b>' + T.esc(sq.p1.topics.join(' · ')) + '</b> <span class="small">(3 câu được hỏi)</span></p><ol>' + asked(sq.p1.qs).map(li).join('') + '</ol>';
    else if (part === 2) h = '<p><b>' + T.esc(sq.p2.title) + '</b></p><p class="small">You should say:</p><ul>' + sq.p2.points.map(li).join('') + '</ul><p>' + T.esc(sq.p2.explain) + '</p>';
    else h = '<p><b>' + T.esc(sq.p3.topic) + '</b> <span class="small">(3 câu được hỏi)</span></p><ol>' + asked(sq.p3.qs).map(li).join('') + '</ol>';
    return '<div class="qprompt" lang="en">' + h + '</div>';
  }
  function show(r) {
      var code = r.code;
      var d = r.data, a = d.asg || {}, h = '';
      h += '<section class="card" style="display:grid;gap:8px"><h2>' + T.esc(r.name) + ' <span class="small">' + T.esc(r.cls) + ' · ' + r.code + '</span></h2><p class="small">Đề: Nghe ' + (a.L || []).join(', ') + ' · Đọc ' + (a.R || []).join(', ') + ' · Viết ' + (a.W || []).join(', ') + ' · Nói ' + (a.S || []).join(', ') + '</p>' +
        '<p><b>Overall: ' + (typeof r.overall === 'number' ? r.overall.toFixed(1) : 'chưa đủ 4 kỹ năng') + '</b></p>' +
        '<div class="row">' + T.ORDER.map(function (k) { return '<button class="btn ghost" style="min-height:36px;padding:0 12px" data-reset="' + k + '">Mở lại ' + T.SKVI[k] + '</button>'; }).join('') + '</div></section>';
      h += '<section class="card"><h2>Nghe</h2>' + ansGrid('L', a.L, d.L) + '</section>';
      h += '<section class="card"><h2>Đọc</h2>' + ansGrid('R', a.R, d.R) + '</section>';
      // writing
      h += '<section class="card" style="display:grid;gap:12px"><h2>Viết</h2>';
      if (!d.W) h += '<p class="small">Chưa nộp.</p>';
      else {
        h += '<div class="grid2"><div><p><b>Task 1</b> · ' + d.W.wc1 + ' từ</p><p class="small">' + T.esc((BANK.W[a.W[0]] || {}).prompt || '') + '</p><div class="essay-view">' + T.esc(d.W.t1) + '</div></div>' +
          '<div><p><b>Task 2</b> · ' + d.W.wc2 + ' từ</p><p class="small">' + T.esc((BANK.W[a.W[1]] || {}).prompt || '') + '</p><div class="essay-view">' + T.esc(d.W.t2) + '</div></div></div>' +
          '<div class="row"><label class="small">Task 1 <select class="sel" id="wb1">' + bands + '</select></label><label class="small">Task 2 <select class="sel" id="wb2">' + bands + '</select></label><label class="small">Band Viết <select class="sel" id="wb">' + bands + '</select></label><span class="small" id="wsug"></span></div>' +
          '<textarea class="essay" id="wc" style="min-height:110px" placeholder="Nhận xét cho học viên (học viên xem được)">' + T.esc(d.W.comment || '') + '</textarea><div class="row"><button class="btn blue" id="wsave">Lưu điểm Viết</button><span class="small" id="wmsg"></span></div>';
      }
      h += '</section>';
      // speaking
      h += '<section class="card" style="display:grid;gap:12px"><h2>Nói</h2>';
      var f = (d.S && d.S.files) || {};
      var sid = (a.S || [])[0], sq = BANK.S[sid] || null;
      if (!Object.keys(f).length) h += '<p class="small">Chưa có file ghi âm.</p>';
      [1, 2, 3].forEach(function (p) {
        if (!f[p] && !sq) return;
        var head = f[p] ? '<p><b>Part ' + p + '</b> · ' + T.fmt(f[p].sec || 0) + ' · <a href="' + f[p].url + '" target="_blank" rel="noopener">Mở trên Google Drive</a></p>' : '<p><b>Part ' + p + '</b> · <span class="small">chưa có file ghi âm</span></p>';
        var player = f[p] ? '<iframe class="au" src="https://drive.google.com/file/d/' + f[p].id + '/preview" loading="lazy" title="Speaking Part ' + p + '"></iframe>' : '';
        h += '<div>' + head + speakingPrompt(sq, p, sq && p !== 2 ? T.speakingPick(sq, sid, r.code, p) : null) + player + '</div>';
      });
      if (d.S) {
        var cr = d.S.crit || {};
        h += '<div class="row"><label class="small">Fluency <select class="sel" id="sfc">' + bands9 + '</select></label><label class="small">Lexical <select class="sel" id="slr">' + bands9 + '</select></label><label class="small">Grammar <select class="sel" id="sgra">' + bands9 + '</select></label><label class="small">Pronunciation <select class="sel" id="sp">' + bands9 + '</select></label><label class="small">Band Nói <select class="sel" id="sb">' + bands + '</select></label><span class="small" id="ssug"></span></div>' +
          '<textarea class="essay" id="sc" style="min-height:110px" placeholder="Nhận xét cho học viên (học viên xem được)">' + T.esc(d.S.comment || '') + '</textarea><div class="row"><button class="btn blue" id="ssave">Lưu điểm Nói</button><span class="small" id="smsg"></span></div>';
      }
      h += '</section>';
      $('#detail').innerHTML = h;

      T.$$('[data-reset]').forEach(function (b) {
        b.onclick = function () {
          var k = b.getAttribute('data-reset');
          T.confirm('Mở lại phần ' + T.SKVI[k] + '?', 'Học viên sẽ làm lại phần này từ đầu bằng cùng mã. Kết quả cũ của phần này sẽ bị xóa.', 'Mở lại').then(function (y) { if (y) tapi('tReset', { code: code, skill: k, clear: true }).then(function () { delete details[code]; var rr = rowOf(code); if (rr) { rr.st[k] = { s: 'open' }; rr[k] = null; rr.overall = null; } flash = 'Đã mở lại ' + T.SKVI[k]; draw(); open(code); }); });
        };
      });
      if (d.W) {
        var sw = function () { var x = +$('#wb1').value, y = +$('#wb2').value; $('#wsug').textContent = 'Gợi ý: ' + half((x + 2 * y) / 3).toFixed(1) + ' (Task 2 tính gấp đôi)'; };
        $('#wb1').value = d.W.b1 != null ? d.W.b1 : 5; $('#wb2').value = d.W.b2 != null ? d.W.b2 : 5; $('#wb').value = d.W.band != null ? d.W.band : 5; sw();
        $('#wb1').onchange = $('#wb2').onchange = function () { sw(); $('#wb').value = half((+$('#wb1').value + 2 * +$('#wb2').value) / 3); };
        $('#wsave').onclick = function () { $('#wmsg').textContent = 'Đang lưu...'; tapi('tGrade', { code: code, skill: 'W', b1: +$('#wb1').value, b2: +$('#wb2').value, band: +$('#wb').value, comment: $('#wc').value }).then(function (x) { $('#wmsg').textContent = x.ok ? 'Đã lưu' : T.err(x); if (x.ok) { var dd = details[code]; if (dd) { Object.assign(dd.data.W, { b1: +$('#wb1').value, b2: +$('#wb2').value, band: +$('#wb').value, comment: $('#wc').value }); dd.overall = x.overall; } saved(code, 'W', +$('#wb').value, x); } }); };
      }
      if (d.S) {
        var cr2 = d.S.crit || {};
        $('#sfc').value = cr2.fc != null ? cr2.fc : 5; $('#slr').value = cr2.lr != null ? cr2.lr : 5; $('#sgra').value = cr2.gra != null ? cr2.gra : 5; $('#sp').value = cr2.p != null ? cr2.p : 5;
        var ss = function () { var v = half((+$('#sfc').value + +$('#slr').value + +$('#sgra').value + +$('#sp').value) / 4); $('#ssug').textContent = 'Gợi ý: ' + v.toFixed(1); return v; };
        $('#sb').value = d.S.band != null ? d.S.band : ss(); ss();
        ['#sfc', '#slr', '#sgra', '#sp'].forEach(function (id) { $(id).onchange = function () { $('#sb').value = ss(); }; });
        $('#ssave').onclick = function () { $('#smsg').textContent = 'Đang lưu...'; tapi('tGrade', { code: code, skill: 'S', crit: { fc: +$('#sfc').value, lr: +$('#slr').value, gra: +$('#sgra').value, p: +$('#sp').value }, band: +$('#sb').value, comment: $('#sc').value }).then(function (x) { $('#smsg').textContent = x.ok ? 'Đã lưu' : T.err(x); if (x.ok) { var dd = details[code]; if (dd) { Object.assign(dd.data.S, { crit: { fc: +$('#sfc').value, lr: +$('#slr').value, gra: +$('#sgra').value, p: +$('#sp').value }, band: +$('#sb').value, comment: $('#sc').value }); dd.overall = x.overall; } saved(code, 'S', +$('#sb').value, x); } }); };
      }
  }

  /* codes */
  $('#create').onclick = function () {
    var list = $('#names').value.split('\n').map(function (l) { var p = l.split(','); return { name: (p[0] || '').trim(), cls: p.slice(1).join(',').trim() }; }).filter(function (x) { return x.name; });
    if (!list.length) return;
    $('#create').disabled = true;
    tapi('tCreate', { list: list }).then(function (r) {
      $('#create').disabled = false;
      var m = $('#cmsg'); m.hidden = false;
      if (!r.ok) { m.className = 'msg err'; m.textContent = T.err(r); return; }
      m.className = 'msg ok'; m.textContent = 'Đã tạo ' + r.made.length + ' mã.'; $('#names').value = '';
      r.made.forEach(function (x) { rows.push({ code: x.code, name: x.name, cls: x.cls, asg: x.asg, st: {}, L: null, R: null, W: null, S: null, overall: null }); });
      ss('ts-ielts-tlist', rows); draw();
    });
  };
  $('#ctbl').onclick = function (e) {
    var code = e.target.getAttribute('data-del'); if (!code) return;
    T.confirm('Xóa mã ' + code + '?', 'Toàn bộ bài làm của học viên này trong bảng tính sẽ bị xóa. File ghi âm trên Drive vẫn còn.', 'Xóa').then(function (y) { if (y) tapi('tDelete', { code: code }).then(function (r) { if (!r.ok) return; rows = rows.filter(function (x) { return x.code !== code; }); ss('ts-ielts-tlist', rows); if (pick === code) { pick = null; $('#detail').innerHTML = ''; } draw(); }); });
  };
  function listText(sep) { return rows.map(function (x) { return [x.name, x.cls, x.code].join(sep); }).join('\n'); }
  $('#csv').onclick = function () {
    var csv = '﻿Họ tên,Lớp,Mã\n' + rows.map(function (x) { return ['"' + String(x.name).replace(/"/g, '""') + '"', '"' + String(x.cls).replace(/"/g, '""') + '"', x.code].join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'ma-vao-thi-ielts.csv'; a.click();
  };
  $('#copy').onclick = function () {
    var t = rows.map(function (x) { return x.name + ': mã ' + x.code; }).join('\n') + '\nLink làm bài: ' + location.href.replace(/dashboard\.html.*$/, '');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { var m = $('#cmsg'); m.hidden = false; m.className = 'msg ok'; m.textContent = 'Đã sao chép.'; })
      .catch(function () { $('#names').value = t; $('#names').select(); });
  };
})();
</script>
