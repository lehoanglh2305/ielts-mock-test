<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kết quả · IELTS Mock Test</title>
<meta name="theme-color" content="#f4e6cf">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css?v=20261023a">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="config.js"></script>
</head>
<body>
<main class="wrap" style="padding-top:16px">
  <a href="index.html" aria-label="Trang chính"><img class="wm" src="assets/logo-black.png" alt="The Standard." width="760" height="96" style="height:30px"></a>
  <section class="card">
    <h2>Xem kết quả</h2>
    <div class="row" style="margin-top:12px"><input class="input codein" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC234" aria-label="Mã vào thi"><button class="btn" id="go">Xem</button></div>
    <p class="msg err" id="err" hidden style="margin-top:12px"></p>
  </section>
  <div id="out" style="display:grid;gap:16px"></div>
  <a class="btn ghost" href="index.html" style="justify-self:start">Về trang chính</a>
</main>
<script src="assets/app.js?v=20261023a"></script>
<script src="assets/descriptors.js?v=20261023a"></script>
<script src="assets/descriptors-vi.js?v=20261023a"></script>
<script>
(function () {
  var T = TS, $ = T.$;
  var s = T.session(); if (s && s.code) $('#code').value = s.code;
  var qc = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase(); if (/^[A-Z0-9]{6}$/.test(qc)) $('#code').value = qc;
  function row(label, val, sub) { return '<div class="tile ' + label + '" style="pointer-events:none"><span class="stamp">' + T.SK[label] + '</span><h3>' + val + '</h3><span>' + (sub || '') + '</span></div>'; }
  $('#go').onclick = function () {
    var c = $('#code').value.trim().toUpperCase(); $('#err').hidden = true;
    var ck = 'ts-ielts-res-' + c, old = T.ls(ck);
    if (old) show(old); else $('#out').innerHTML = '<p class="small">Đang tải kết quả...</p>';
    $('#go').disabled = true;
    T.api('result', { code: c }).then(function (r) {
      $('#go').disabled = false;
      if (!r.ok) { if (old && r.error !== 'no_code') return; $('#out').innerHTML = ''; T.ls(ck, null); $('#err').textContent = T.err(r); $('#err').hidden = false; return; }
      T.ls(ck, r); show(r);
    });
  };
  /* One card per task or skill: for each criterion, the score the marker gave and the published descriptor of that band. */
  var NAME_VI = { 'Task Achievement': 'Hoàn thành yêu cầu đề bài', 'Task Response': 'Đáp ứng đề bài', 'Coherence and cohesion': 'Mạch lạc và liên kết', 'Lexical resource': 'Vốn từ vựng', 'Grammatical range and accuracy': 'Phạm vi và độ chính xác ngữ pháp', 'Fluency and coherence': 'Độ trôi chảy và mạch lạc', 'Pronunciation': 'Phát âm' };
  function descCard(title, items) {
    var cells = items.filter(function (c) { return typeof c[1] === 'number'; }).map(function (c) {
      return '<div class="wcell"><span style="font-weight:600">' + T.esc(c[0]) + (NAME_VI[c[0]] ? '<span class="dl-vi small" style="display:block;font-weight:400">' + NAME_VI[c[0]] + '</span>' : '') + '<span style="display:block;color:var(--cobalt)">Band ' + (c[1] % 1 ? c[1].toFixed(1) : c[1]) + '</span></span><div class="wdesc">' + T.bandDesc(c[2], c[1]) + '</div></div>';
    });
    if (!cells.length) return '';
    return '<section class="card"><div class="dlhead"><h2>' + title + '</h2>' + (T.dlToggle ? T.dlToggle() : '') + '</div><p class="small" style="margin-top:6px">Mô tả của từng tiêu chí ở band bạn nhận được, lấy từ bảng Band Descriptors của IELTS. Dùng để hiểu điểm của mình, không thay thế kết quả IELTS chính thức.<span class="dl-vi"> Bản tiếng Việt là bản dịch tham khảo của lớp The Standard, bản tiếng Anh mới là bản gốc.</span></p><div class="wgrid" style="margin-top:12px">' + cells.join('') + '</div></section>';
  }
  function show(r) {   // never leave the page blank: if drawing fails, say so and how to fix it
    try { draw(r); } catch (e) { $('#out').innerHTML = '<p class="msg err">Trang chưa tải đúng phiên bản mới. Bấm Ctrl+F5 (hoặc xóa bộ nhớ đệm của trình duyệt) rồi thử lại.</p>'; }
  }
  function draw(r) {
      var x = r.res, st = r.st || {}, h = '';
      var stv = function (sk) { var v = (st[sk] || {}).s || 'open'; return v === 'open' ? 'Chưa làm' : v === 'started' ? 'Đang làm dở' : ''; };
      h += '<section class="result"><span class="stamp">' + T.esc(r.name) + (r.cls ? ' · ' + T.esc(r.cls) : '') + '</span><p class="big">' + (typeof x.overall === 'number' ? 'Overall ' + x.overall.toFixed(1) : 'Chưa đủ 4 kỹ năng') + '</p>' +
        '<p>' + (typeof x.overall === 'number' ? 'Điểm tổng là trung bình 4 kỹ năng, làm tròn đến 0.5 gần nhất.' : 'Điểm tổng sẽ hiện khi có đủ điểm Nghe, Đọc, Viết và Nói.') + '</p></section>';
      h += '<div class="tiles">';
      h += row('L', x.L ? 'Band ' + T.bandText(x.L.band) + ' (ước tính)' : stv('L'), x.L ? x.L.raw + ' trên 40 câu đúng' : '');
      h += row('R', x.R ? 'Band ' + T.bandText(x.R.band) + ' (ước tính)' : stv('R'), x.R ? x.R.raw + ' trên 40 câu đúng' : '');
      h += row('W', x.W ? (typeof x.W.band === 'number' ? 'Band ' + T.bandText(x.W.band) : 'Chờ chấm') : stv('W'), x.W && typeof x.W.t1 === 'number' ? 'Task 1: ' + x.W.t1.toFixed(1) + ' · Task 2: ' + (typeof x.W.t2 === 'number' ? x.W.t2.toFixed(1) : '...') : '');
      h += row('S', x.S ? (typeof x.S.band === 'number' ? 'Band ' + T.bandText(x.S.band) : 'Chờ chấm') : stv('S'), '');
      h += '</div>';
      h += '<p class="small">Band Nghe và Đọc là ước tính từ đề rút gọn, chỉ để tham khảo, không thay thế kết quả IELTS chính thức.</p>';
      if (x.W && x.W.comment) h += '<section class="card"><h2>Nhận xét phần Viết</h2><p style="white-space:pre-wrap;margin-top:8px">' + T.esc(x.W.comment) + '</p></section>';
      if (x.S && x.S.comment) h += '<section class="card"><h2>Nhận xét phần Nói</h2>' + (x.S.crit ? '<p class="small" style="margin-top:6px">Fluency and Coherence ' + x.S.crit.fc + ' · Lexical Resource ' + x.S.crit.lr + ' · Grammar ' + x.S.crit.gra + ' · Pronunciation ' + x.S.crit.p + '</p>' : '') + '<p style="white-space:pre-wrap;margin-top:8px">' + T.esc(x.S.comment) + '</p></section>';
      if (window.BAND_DESC) {
        var D = BAND_DESC;
        if (x.W && x.W.crit) [1, 2].forEach(function (t) {
          var c = x.W.crit['t' + t] || {}, d = D['t' + t];
          h += descCard('Mô tả band phần Viết · Task ' + t, [[t === 1 ? 'Task Achievement' : 'Task Response', c.ta, d.ta], ['Coherence and cohesion', c.cc, d.cc], ['Lexical resource', c.lr, d.lr], ['Grammatical range and accuracy', c.gra, d.gra]]);
        });
        if (x.S && x.S.crit) h += descCard('Mô tả band phần Nói', [['Fluency and coherence', x.S.crit.fc, D.s.fc], ['Lexical resource', x.S.crit.lr, D.s.lr], ['Grammatical range and accuracy', x.S.crit.gra, D.s.gra], ['Pronunciation', x.S.crit.p, D.s.p]]);
      }
      $('#out').innerHTML = h;
  }
  $('#code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#go').click(); });
  if ($('#code').value) $('#go').click();
})();
</script>
</body>
</html>
